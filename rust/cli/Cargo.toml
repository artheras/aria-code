[package]
name = "aria-native"
version = "0.4.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
publish = false
description = "Experimental Rust entry point for the Aria Code Python runtime"

[dependencies]
aria-graph = { path = "../graph" }
serde_json = "1.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1.12"
ctrlc = "3.4"
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
