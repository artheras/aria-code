suite: projects
tasks:
  - id: inventory-cli-feature
    prompt: >-
      给 inventory_report 项目添加可运行的 CLI：python -m inventory_report input.json --output report.json。
      输入是 JSON 数组，每项有 sku、on_hand 和 reserved，后两个字段是非负整数；同一 sku 可有多行。
      按 sku 汇总 on_hand-reserved，输出为按 sku 排序的 JSON 数组，每项是 {"sku": 原 sku, "available": 汇总数量}。
      数组为空时输出 []，支持中文 sku。非法输入（缺字段、数量不是非负整数、sku 为空或不是字符串）
      应以非零状态退出且不要创建输出文件。遵循 AGENTS.md，将计算和命令行处理分开，并补充 README 中的用法。
      只使用标准库，不安装或复制第三方包，也不要创建 pytest.py 等测试引导脚本。
      不要修改测试或项目规则。最后运行 unittest 项目测试，确认程序可以从命令行使用。
    fixture: inventory_cli_feature
    verify: "{python} -m unittest discover -s tests -v"
    protect: ["tests/**", "AGENTS.md"]
    tags: [software, python, project, cli]
