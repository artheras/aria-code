version: '3.9'
services:
  aria-local:
    build:
      context: .
      dockerfile: Dockerfile
    image: aria-code:local
    restart: unless-stopped
    volumes:
    - ${HOME}/.aria:/root/.aria
    - ${HOME}/.ollama:/root/.ollama
    environment:
    # No default: the client refuses to connect until it is set (setup wizard).
    - ARIA_RELAY_URL=${ARIA_RELAY_URL:-}
    - ARIA_RELAY_CLIENT_ID=${ARIA_RELAY_CLIENT_ID}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - FEISHU_APP_ID=${FEISHU_APP_ID:-}
    - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
    - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
    - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
    - aria-net
    command: python3 -m aria_code.aria_daemon
  # The chat bots run from their own image (services/aria-bots), which
  # carries aria-runtime for chat turns and market commands.
  aria-relay-client:
    build:
      context: .
      dockerfile: services/aria-bots/Dockerfile
    image: aria-bots:local
    restart: unless-stopped
    # Root, like the image this replaced: it reads the host's ~/.aria
    # (relay credentials in a 0600 .env, model config, daemon.db).
    user: "0:0"
    volumes:
    - ${HOME}/.aria:/root/.aria
    environment:
    - HOME=/root
    - ARIA_RELAY_URL=${ARIA_RELAY_URL:-}
    - ARIA_RELAY_CLIENT_ID=${ARIA_RELAY_CLIENT_ID}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - FEISHU_APP_ID=${FEISHU_APP_ID:-}
    - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
    - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
    - ollama
    networks:
    - aria-net
  # Optional: docker compose --profile telegram up. One poller per bot token:
  # leave TELEGRAM_BOT_TOKEN out of ~/.aria/.env for aria-local if you use this.
  aria-telegram-bot:
    image: aria-bots:local
    profiles: ["telegram"]
    restart: unless-stopped
    user: "0:0"
    volumes:
    - ${HOME}/.aria:/root/.aria
    environment:
    - HOME=/root
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    - TELEGRAM_ALLOWED_IDS=${TELEGRAM_ALLOWED_IDS:-}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
    - aria-relay-client
    networks:
    - aria-net
    entrypoint: ["aria-telegram-bot"]
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
    - ollama-models:/root/.ollama
    networks:
    - aria-net
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:11434/api/tags
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  ollama-models: null
networks:
  aria-net:
    driver: bridge
