# gitleaks configuration.
#
# .gitleaksignore pins exemptions to individual commit fingerprints, which does
# not survive the key arriving again in a new commit — and it is due to, via
# feat/verified-agent-loop (PR #10). This allowlist is keyed on what the value
# actually is instead, so it keeps holding.

[extend]
useDefault = true

[[allowlists]]
description = """
Firebase Web API key in the CLI's Google sign-in flow.

Firebase Web API keys are public by design: they identify the project and
authorise nothing on their own — the same value ships in the web and desktop
client bundles, and google_login.py says so at the definition. Access is
governed by Firebase security rules and API-key restrictions, not by keeping
the value secret, so this is a rule match rather than a disclosed credential.

Scoped to that one file AND to the AIza key shape, so any other secret in that
file, and this shape anywhere else, still fails the scan.

Worth confirming separately that the key's API-key restrictions and Firebase
security rules are actually configured — the value being public only stays
harmless while those are.
"""
condition = "AND"
paths = ['''(^|/)google_login\.py$''']
regexes = ['''AIza[0-9A-Za-z\-_]{35}''']

[[allowlists]]
description = """
Made-up secrets in the masking tests.

tests/test_tool_step_output.py checks that commands shown on screen have their
secrets masked, so it has to contain secret-shaped strings: a Bearer token, a
password in a URL, sk-/ghp_/AIza-shaped keys. None was ever a credential. The
scan covers history, so the commit that added them keeps failing it unless
they are allowed.

Scoped to that one file AND to exactly these values, so a real key in that
file, or these values anywhere else, still fails the scan.
"""
condition = "AND"
paths = ['''(^|/)tests/test_tool_step_output\.py$''']
regexes = [
    '''abc\.def\.ghi''',
    '''hunter2''',
    '''sk-live1234567890abcd''',
    '''ghp_abcdefghijklmnop''',
    '''AIzaSyA1234567890abcdefghijk''',
    '''\babc123\b''',
    '''s3cr3t''',
]

[[allowlists]]
description = """
A made-up Bearer token in the -p event tests.

tests/test_exec_events.py checks that a command's parameters have their
secrets masked before they reach the jsonl event stream, so it carries a
curl command with an Authorization header. The value was never a credential.
Since that commit (PR #118) the history scan has failed on it.

Scoped to that one file AND to exactly this value.
"""
condition = "AND"
paths = ['''(^|/)tests/test_exec_events\.py$''']
regexes = ['''abc123def456''']

[[allowlists]]
description = """
Made-up secrets in the run-history redaction tests.

tests/test_run_store_redaction.py checks that prompts, errors and events are
stored with their credentials redacted, so it has to contain credential-shaped
strings: a Bearer token in a curl header and a ghp_-shaped token. Neither was
ever a credential. Since that commit (PR #166) the history scan has failed on
them.

Scoped to that one file AND to exactly these values.
"""
condition = "AND"
paths = ['''(^|/)tests/test_run_store_redaction\.py$''']
regexes = [
    '''abc\.def-123''',
    '''ghp_abcdefghijklmnop1234''',
]
