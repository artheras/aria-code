[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-code"
version = "4.4.2"
description = "General-purpose AI product reviewer and coding agent with optional finance capabilities"
readme = "README.md"
license = { text = "BUSL-1.1" }
# Upper bound is real, not defensive: the core dep pandas_ta pulls numba, and
# numba hard-refuses to build on 3.14 ("only versions >=3.10,<3.14 are
# supported"). Without this bound pip happily starts the install on 3.14 and
# fails deep in the dependency tree on a numba source build — an error that
# names neither aria-code nor pandas_ta. With it, pip refuses up front with a
# clear "requires a different Python" message. Verified 3.13 installs and runs
# (`aria-code --version` → 4.2.0); raise the bound once numba ships 3.14 wheels.
requires-python = ">=3.10,<3.14"
keywords = ["ai", "llm", "coding-agent", "code-review", "product-review", "terminal", "cli", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Core dependencies (slim — always installed) ───────────────────────────────
# Kept deliberately lean so `pip install aria-code` is fast and a future frozen
# binary stays small. Heavy / freeze-hostile sources (akshare, ccxt), file
# parsers, the SQL engine and chart renderer are optional extras below — the
# code already lazy-imports them and degrades gracefully when absent.
dependencies = [
    # Verify TLS against the OS trust store. Machines behind a
    # TLS-intercepting proxy install that proxy's CA in the system keychain,
    # not in certifi, so without this every HTTPS call fails there.
    "truststore>=0.9; python_version >= '3.10'",
    # CLI runtime
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "PyYAML>=6.0.2",
    "requests>=2.32.0",
    "httpx[http2]>=0.27.0",
    "PyJWT>=2.8.0",
    "aiofiles>=23.2.0",
    "websockets>=12.0",
    "apscheduler>=3.10.0",
    "ddgs>=9.0",            # keyless web_search fallback — tiny, kept in core so search works even on a slim/degraded install
    # Quant core (used across indicators, risk, formatting)
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "pandas_ta>=0.4.67b0; python_version >= '3.12'",  # PyPI removed 0.3.x; 0.4.x is 3.12-only. Optional — code has graceful fallback (find_spec/try-except).
    "yfinance>=0.2.55",
    # macOS native PDF engine for /report --pdf (WKWebView.createPDF; no browser
    # required). Non-darwin platforms use headless Chrome / weasyprint instead.
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
    # Markdown deliverable rendering (markdown_pdf.py: styled zh/en report PDF)
    "markdown>=3.6",
]

[project.optional-dependencies]

# Internal review service used by the Arthera API gateway. Kept optional so the
# local terminal remains lightweight.
service = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

# ── Data sources (heavy / region-specific) ────────────────────────────────────
cn = ["akshare>=1.14.68"]          # China A-share / HK market data (large dep tree)
crypto = ["ccxt>=4.4.0"]           # crypto exchanges (large dep tree)

# ── Feature add-ons ────────────────────────────────────────────────────────────
charts = ["mplfinance>=0.12.9"]    # candlestick charts in /report /chart
data = ["duckdb>=0.10.3"]          # in-process SQL: /data sql "SELECT …"
files = [                          # /file load + /file analyze document parsing
    "pdfplumber>=0.11.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.3",
    "Pillow>=10.4.0",
]
video = [
    "opencv-python>=4.8.0",       # analyze_file keyframes; also video_analysis.detect_scenes
    "google-auth>=2.30.0",        # video_workflow talks to Vertex with ADC, never an API key
]
video_analysis = ["faster-whisper>=1.0.0"]   # video_analysis.transcribe_video (local, no API key)

# ── Google Agent Development Kit ─────────────────────────────────────────────
# Kept optional: the standard CLI remains independent of a cloud-agent runtime.
# Install with: pip install -e '.[adk]'
adk = ["google-adk>=2.6.3"]

# ── Broker connectivity ────────────────────────────────────────────────────────
ibkr = ["ib_insync>=0.9.86"]
futu = ["futu-api>=9.1.5108"]
tiger = ["tigeropen>=3.2.0"]
longbridge = ["longbridge>=1.0.22"]
alpaca = ["alpaca-py>=0.35.0"]
webull = ["webull>=0.3.14"]

# All brokers bundle
brokers = [
    "ib_insync>=0.9.86",
    "futu-api>=9.1.5108",
    "tigeropen>=3.2.0",
    "longbridge>=1.0.22",
    "alpaca-py>=0.35.0",
]

# ── Enhanced backtesting ───────────────────────────────────────────────────────
backtest = ["vectorbt>=0.26.2"]

# ── Local, self-hosted image generation (no API key, no per-call cost) ─────────
image_gen = [
    "torch>=2.2.0",
    "diffusers>=0.30.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
]

# ── Web search / browser / desktop automation ──────────────────────────────────
web = ["ddgs>=9.0"]                                # zero-config web_search fallback
browser = ["playwright>=1.44.0"]                   # headless browser (/browser)
desktop = ["mss>=9.0.1", "pyautogui>=0.9.54"]      # screen capture + GUI automation
sports = ["understat>=0.1.0"]                       # football xG data

# ── Language-server diagnostics (/lsp, lsp_autocheck) ──────────────────────────
lsp = ["python-lsp-server[all]>=1.10.0"]

# ── Developer tools ────────────────────────────────────────────────────────────
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# ── Full feature set (what the bootstrap installers install by default) ────────
# Everything a normal user wants — all data sources + files + charts + SQL —
# but no brokers / dev / backtest extras.
full = [
    "akshare>=1.14.68",
    "ccxt>=4.4.0",
    "mplfinance>=0.12.9",
    "duckdb>=0.10.3",
    "pdfplumber>=0.11.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.3",
    "Pillow>=10.4.0",
    "ddgs>=9.0",
]

# ── Everything (full + brokers + backtest + automation + dev) ─────────────────
all = [
    "akshare>=1.14.68",
    "ccxt>=4.4.0",
    "mplfinance>=0.12.9",
    "duckdb>=0.10.3",
    "pdfplumber>=0.11.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.3",
    "Pillow>=10.4.0",
    "ddgs>=9.0",
    "playwright>=1.44.0",
    "mss>=9.0.1",
    "pyautogui>=0.9.54",
    "opencv-python>=4.8.0",
    "understat>=0.1.0",
    "ib_insync>=0.9.86",
    "futu-api>=9.1.5108",
    "tigeropen>=3.2.0",
    "longbridge>=1.0.22",
    "alpaca-py>=0.35.0",
    "vectorbt>=0.26.2",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
aria-code = "aria_code.apps.cli.main:main"
aria-code-mcp = "aria_code.aria_mcp_server:main"

[project.urls]
Homepage = "https://github.com/artherahq/aria-code"
Repository = "https://github.com/artherahq/aria-code"
Issues = "https://github.com/artherahq/aria-code/issues"

# ── Package discovery ──────────────────────────────────────────────────────────
[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
# Real top-level packages (dirs with __init__.py). packages.find only matches
# package directories — single-file top-level modules are declared in
# [tool.setuptools].py-modules above, NOT here.
#
# 这份清单必须覆盖所有带 __init__.py 的顶层目录。2026-08-19 修复：
# clients / domain / tools 三个目录漏在外面——它们正是 refactor_structure.py
# 那次迁移新建的，26 个根模块的真实实现都搬了进去，但 include 清单没跟着更新
# （providers 加了，这三个没加）。后果不是"少装几个文件"，而是**已发布的包是
# 坏的**：24 个 re-export shim 在 py-modules 里有声明、会随包发布，可它们
# `_import_module("clients.market_data_client")` 的目标却不在包里。实测在只含
# 打包内容的干净环境里 `import market_data_client` 直接
# ModuleNotFoundError: No module named 'clients'。连同直接 import
# tools./clients./domain. 的 10 处，以及这三个目录自身的 29 个文件、15,435 行
# 代码，全部从未随包发出去过。
#
# 校验方式（改动本清单后请重跑）：
#   python -c "
#   from setuptools.discovery import PEP420PackageFinder as F
#   print(sorted({p.split('.')[0] for p in F.find(where='.', include=[...])}))"
# 结果应与 `git ls-files '*/__init__.py'` 里的顶层目录集合一致。
include = ["aria_code*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md", "*.txt", "*.sh"]

# ── Ruff linting ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git", ".venv", "venv", "__pycache__", "dist", "build",
    "npm", ".github", "aria-output",
    # 2026-08-20：aria_cli.py 与 dashboard_generator.py 曾整体排除在这里，理由是
    # "手工对齐、不参与重排"。但 exclude 是全局的——它连带关掉了**查 bug 的规则**。
    # 代价是真实的：F821（未定义名字）在 commands/ 里抓到过一次启动即崩的
    # NameError，而同类 bug 落在 7000 行的 aria_cli.py 里，CI 永远看不见。
    # 现在两个文件都进 lint；格式类诉求由下面的 per-file-ignores 单独豁免，
    # 而不是靠整文件失明来换。
]

[tool.ruff.lint]
# 分两档：select 里的是**硬失败**（CI 阻塞），第二档见文件末尾的说明。
#
# 2026-08-19 新增 E722 与 F601 —— 它们不是风格问题，是能藏 bug 的形态：
#   E722 裸 except  会连 KeyboardInterrupt / SystemExit 一起吞掉，
#        循环里跑着时用户按 Ctrl+C 会被静默忽略。
#   F601 重复字典键 后面的静默覆盖前面的。实际抓到过：market_detect 里
#        "汇丰" 在港股表(0005.HK)和美股表(HSBC)各出现一次，后者覆盖前者，
#        导致 "汇丰" 解析成美股 ADR 而 "汇丰控股" 解析成港股——同一家公司
#        两个结果。
select = ["E9", "F821", "F823", "F811", "W191", "E722", "F601"]

# E501(行长) / E402(import 位置) 是本仓库有意的风格；F401 多为 re-export，
# 删掉会破坏调用方。F811 在 select 与 ignore 同时出现是历史遗留（ignore 生效）。
ignore = ["E501", "F401", "E402", "F811"]

[tool.ruff.lint.per-file-ignores]
# Mixin command files rely on globals injected by aria_cli.py (console, HAS_RICH, etc.)
# F821 is suppressed here because the names are valid at runtime via the main module's namespace.
"apps/cli/commands/*.py" = ["F821"]
"src/aria_code/apps/cli/commands/*.py" = ["F821"]
"**/apps/cli/commands/*.py" = ["F821"]
"apps/cli/providers/llm/ollama_stream.py" = ["F821"]
"src/aria_code/apps/cli/providers/llm/ollama_stream.py" = ["F821"]
"**/apps/cli/providers/llm/ollama_stream.py" = ["F821"]
"apps/cli/football_reports.py" = ["F821"]
"src/aria_code/apps/cli/football_reports.py" = ["F821"]
"**/apps/cli/football_reports.py" = ["F821"]
"apps/cli/broker_render.py" = ["F821"]
"src/aria_code/apps/cli/broker_render.py" = ["F821"]
"**/apps/cli/broker_render.py" = ["F821"]

# aria_cli.py 的"未使用 import"绝不能自动清理：它的 globals() 就是所有 rebound
# mixin 方法的命名空间，94 个 ruff 眼里没用到的 import 里有 51 个是给它们准备的
# （pathlib 一个就被 commands/ 用了 75 次）。跑一次 `ruff check --fix` 会批量重演
# 2026-08-09 那个启动即崩的 NameError。契约由 tests/test_rebind_namespace_contract.py
# 看守；这里显式记一笔，免得后来人以为这是可以顺手清的死代码。
"aria_cli.py" = ["F401"]

# ── Black (optional local use) ─────────────────────────────────────────────────
[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
    \.git | \.venv | venv | __pycache__ | dist | build | npm |
    aria_cli\.py | dashboard_generator\.py
)/
'''

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:google\\.protobuf\\.internal\\.well_known_types",
]
