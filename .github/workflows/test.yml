name: test

on:
  push:
    branches: [main, "ci/**", "agent/**"]
  pull_request:
  workflow_dispatch:

jobs:
  relay-startup:
    name: relay listens on Cloud Run PORT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install relay runtime
        run: python -m pip install fastapi uvicorn httpx websockets
      - name: Start packaged relay and probe HTTP
        shell: bash
        env:
          PYTHONPATH: src
          PORT: "18765"
          DB_PATH: ${{ runner.temp }}/relay-smoke.sqlite
        run: |
          python -m aria_code.aria_relay_server > "$RUNNER_TEMP/relay.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --show-error --fail "http://127.0.0.1:$PORT/status"; then
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/relay.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/relay.log"
          exit 1

  npm-wrapper:
    name: npm wrapper tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dispatcher unit tests (platform resolution)
        working-directory: npm
        run: npm test

  # The install is now a dispatcher plus one prebuilt binary, so there is no
  # postinstall to exercise: nothing is built, cloned or pip-installed at
  # install time. What can still break is the handoff — a tarball whose bin/
  # entry is missing, a platform key that resolves to a package nobody
  # publishes, or a binary shipped without +x. This job installs the packed
  # dispatcher on all three platforms and checks that it fails the way it is
  # supposed to when no platform package is present, which is the only
  # behaviour testable without the release binaries.
  #
  # The end-to-end run with a real binary happens on a tag, in
  # build-native-binaries.yml.
  install-smoke-test:
    name: install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pack the dispatcher
        working-directory: npm
        shell: bash
        run: npm pack --pack-destination "${{ runner.temp }}"

      - name: It must fail clearly, not silently or vaguely
        shell: bash
        run: |
          # Run the packed launcher without installing dependencies. A global
          # npm install can fetch an already-published optional package even
          # with --omit=optional, making this absence test depend on registry
          # state rather than on the launcher's behavior.
          TEMP_DIR="${{ runner.temp }}"
          if command -v cygpath >/dev/null 2>&1; then
            TEMP_DIR="$(cygpath -u "$TEMP_DIR")"
          fi
          PKG=$(ls "$TEMP_DIR"/artheras-aria-code-*.tgz)
          mkdir -p "$TEMP_DIR/dispatcher-no-optional"
          tar -xzf "$PKG" -C "$TEMP_DIR/dispatcher-no-optional"
          set +e
          OUT="$(node "$TEMP_DIR/dispatcher-no-optional/package/bin/aria-code.js" --version 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::exited 0 with no binary installed"
            exit 1
          fi
          # The message has to name the package npm should have fetched, or the
          # user has nothing to act on.
          echo "$OUT" | grep -q "@artheras/aria-code-" || {
            echo "::error::the error does not name the missing platform package"
            exit 1
          }
          echo "OK: refused with an actionable message on ${{ matrix.os }}"

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Match the dependency set the suite is known green under: core + cn
        # (akshare) + dev (pytest, pytest-asyncio). Optional features without
        # their extra installed (ccxt/duckdb/mplfinance/…) skip gracefully.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cn,dev]"

      - name: Test
        env:
          # Same reason ci.yml sets it: without this, symbol routing calls
          # fetch_market_universe() (akshare, no timeout) and the affected
          # cases — which test pure local routing against a static table —
          # hang or fail on a live HTTP call. CI only; unset behaviour for
          # users and the hosted service is unchanged.
          ARIA_OFFLINE: "1"
        run: pytest --ignore=tests/e2e -q --timeout=60
