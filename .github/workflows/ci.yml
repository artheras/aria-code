name: CI

on:
  push:
    branches:
      - main
      - develop
      - dev
      - "agent/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
      - "docs/**"
      - "release/**"
      - "codex/**"
    paths-ignore:        # docs-only changes don't need the full install + test matrix
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

jobs:
  runtime-integration:
    name: Runtime integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install runtime tests
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - name: Exercise child cleanup, sandbox and actual HTTP tool round trips
        env:
          ARIA_OFFLINE: "1"
        run: >-
          python -m pytest tests/test_background_processes.py tests/test_os_sandbox.py
          tests/test_linux_sandbox_integration.py tests/test_sse_http_roundtrip.py
          tests/test_robot_artwork.py tests/test_prompt_dates.py tests/test_doctor_sandbox.py
          tests/test_verification_runner_selection.py -q --timeout=60

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run all Python versions to completion — don't cancel siblings on first failure
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout
          # Relay and project-review service test deps; without them those tests skip.
          pip install fastapi uvicorn python-multipart
          # google-genai backs the Gemini/Vertex provider (aria_code.apps.cli.providers.vertexai_stream),
          # now the default cloud model — kept optional in pyproject.toml so the
          # base install stays light, but installed here so its tests run for
          # real instead of failing on ModuleNotFoundError.
          pip install google-genai
          # Installs this repo itself (no-deps: requirements.txt already covers
          # its dependencies) so `aria_code` is importable outside pytest's own
          # process too — several tests deliberately spawn a subprocess to
          # check import-time behavior on a fresh interpreter, which pytest's
          # `pythonpath` ini setting does not reach.
          pip install --no-deps -e .

      # 只把"能抓真 bug"的三类设成硬失败：name-defined / used-before-def /
      # no-redef。其余 280 个（多为缺类型注解）留作后续逐模块收紧——一次性
      # 开全会得到 4001 个错误，那样的门禁只会被绕过，等于没有。
      #
      # 这条门禁的直接由来：2026-08-19 的 `NameError: pathlib` 让 CLI 在所有
      # 受支持的 Python 版本上启动即崩溃，CI 红了十天没人发现。mypy 对那段
      # 代码一行就能报出来。加它的当天就又抓到 4 处 used-before-def
      # （/backtest ml 与 /backtest agent 两条路径必然 UnboundLocalError）。
      - name: Type check (mypy — bug-catching rules only)
        run: |
          pip install mypy
          mypy --config-file mypy.ini . 2>&1 | tee /tmp/mypy.log || true
          if grep -qE '\[(name-defined|used-before-def|no-redef)\]' /tmp/mypy.log; then
            echo "::error::mypy 发现未定义名 / 定义前使用 / 重复定义"
            grep -E '\[(name-defined|used-before-def|no-redef)\]' /tmp/mypy.log
            exit 1
          fi
          echo "✓ 无 name-defined / used-before-def / no-redef"

      - name: Run tests (unit — no LLM required)
        env:
          # 关掉行情宇宙的联网抓取。fetch_market_universe() 会打 akshare
          # (stock_info_a_code_name / stock_hk_spot_em)，无超时，在 CI 上会挂到
          # pytest-timeout 的 60 秒上限——而受影响的用例测的是纯本地的自然语言
          # 路由逻辑，答案来自静态映射表，本就不需要网络。
          # 只影响 CI；不设这个变量时默认仍然联网，用户与线上服务行为不变。
          ARIA_OFFLINE: "1"
        run: |
          pytest tests/ -v -k "not e2e and not provider_integration" \
            --tb=short --timeout=60

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint (errors and undefined names only)
        run: ruff check . --select E9,F821,F823 --statistics

      - name: Ruff style warnings (non-blocking)
        run: ruff check . || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the complete reachable history as well as the checked-out tree.
          fetch-depth: 0

      # 2026-08-19：从 gitleaks/gitleaks-action@v2 换成直接跑二进制。
      # 该 Action 对**组织**账户要求付费 license，仓库迁到 artherahq 组织后
      # 每次都以 "missing gitleaks license" 失败，Security Scan 常年红灯——
      # 红灯常态化的代价是真出问题时没人会注意（同一天已经吃过一次亏：
      # ci.yml 的 3.10/3.11/3.12 早就在报 NameError，因为整体是红的而被忽略）。
      # gitleaks 本体是 MIT 开源，只有 Action 包装器收费，所以直接用二进制，
      # 扫描能力完全一致，且不引入付费依赖。
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository and history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  eval-preflight:
    name: Eval suites still measure something
    runs-on: ubuntu-latest
    # 不需要模型、不需要 API key、几秒钟。它只回答一个问题：套件里的任务
    # 还都是「一开始是红的」吗？
    #
    # 这道门禁的直接由来：一个漂移成绿色的 fixture 是一次**静默的记分牌注水** ——
    # 套件会报出不断上升的通过率，同时量到的东西越来越少，而且这个故障恰恰
    # 因为数字好看而不可见。跑一次 --check 的代价是每个任务一条命令，换来的是
    # 在造成它的那个 commit 上抓住它，而不是一个月以后对着一个假的分数做决策。
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyyaml

      - name: Every task must still start red
        run: |
          python -m aria_code.evals.runner evals/suites/core.yaml --check
          python -m aria_code.evals.runner evals/suites/operations.yaml --check
          python -m aria_code.evals.runner evals/suites/hard.yaml --check
          python -m aria_code.evals.runner evals/suites/projects.yaml --check

  # ── The release artifact must actually install and run ──────────────────────
  # Nothing here ever built a wheel and looked inside it, and three defects lived
  # in that gap at once: packages.find pointed at the repo root instead of src/
  # so the wheel held zero modules (7 KB against 4.4.2's 1.75 MB); the console
  # script then died on `No module named 'aria_cli'` because the tree imports
  # itself bare and only pyproject's pythonpath made that work; and CI installed
  # with `pip install -e .`, which never exercises either.
  #
  # Separate job, not folded into the test matrix: it builds a wheel and creates a
  # virtualenv, which is tens of seconds, and it must run on a machine with no
  # source tree on the path.
  packaging:
    name: Wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build + test deps only
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Build the wheel, install it clean, run the console script
        run: python -m pytest tests/test_wheel_is_installable.py -q
