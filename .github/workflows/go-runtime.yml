name: Native Go runtime

on:
  pull_request:
    paths:
      - 'go/runtime/**'
      - 'rust/**'
      - 'tests/test_native_runtime_domain.py'
      - 'tests/test_native_training_compare.py'
      - 'tests/test_native_training_dataset.py'
      - 'tests/test_native_go_app.py'
      - 'tests/test_native_go_bridge.py'
      - 'tests/test_native_go_stream.py'
      - 'tests/test_native_go_risk.py'
      - 'tests/test_native_go_contract.py'
      - 'tests/test_native_go_delivery.py'
      - 'tests/test_native_go_review.py'
      - 'tests/test_native_go_acceptance.py'
      - 'tests/test_native_go_providers.py'
      - 'tests/test_native_eval_trajectories.py'
      - 'src/aria_code/evals/**'
      - 'src/aria_code/apps/cli/exec_events.py'
      - 'src/aria_code/providers/llm/custom.py'
      - 'src/aria_code/providers/llm/openai_compat.py'
      - 'src/aria_code/workspace/verify.py'
      - 'src/aria_code/ariarc.py'
      - 'src/aria_code/packs/rules.py'
      - 'src/aria_code/runtime/baseline.py'
      - 'src/aria_code/runtime/review.py'
      - 'tests/test_relay_contract.py'
      - 'src/aria_code/runtime/delivery.py'
      - 'src/aria_code/runtime/acceptance.py'
      - 'src/aria_code/safety/risk.py'
      - 'src/aria_code/safety/permissions.py'
      - 'src/aria_code/runtime/contract.py'
      - 'src/aria_code/apps/cli/providers/runtime_bridge.py'
      - 'src/aria_code/ui/render/output.py'
      - 'tests/test_native_checkpoints.py'
      - 'src/aria_code/change_store.py'
      - 'src/aria_code/runtime/checkpoints.py'
      - 'src/aria_code/runtime/run_store.py'
      - 'src/aria_code/apps/cli/native_bridge.py'
      - 'src/aria_code/apps/cli/tools/file_tools.py'
      - 'src/aria_code/workspace/files.py'
      - 'src/aria_code/training/**'
      - 'src/aria_code/domain/backtest_engine.py'
      - '.github/workflows/go-runtime.yml'
      - '.github/scripts/annotate-failure.sh'
      - '.gitattributes'
  push:
    branches: [main]
    paths:
      - 'go/runtime/**'
      - 'rust/**'
      - 'tests/test_native_runtime_domain.py'
      - 'tests/test_native_training_compare.py'
      - 'tests/test_native_training_dataset.py'
      - 'tests/test_native_go_app.py'
      - 'tests/test_native_go_bridge.py'
      - 'tests/test_native_go_stream.py'
      - 'tests/test_native_go_risk.py'
      - 'tests/test_native_go_contract.py'
      - 'tests/test_native_go_delivery.py'
      - 'tests/test_native_go_review.py'
      - 'tests/test_native_go_acceptance.py'
      - 'tests/test_native_go_providers.py'
      - 'tests/test_native_eval_trajectories.py'
      - 'src/aria_code/evals/**'
      - 'src/aria_code/apps/cli/exec_events.py'
      - 'src/aria_code/providers/llm/custom.py'
      - 'src/aria_code/providers/llm/openai_compat.py'
      - 'src/aria_code/workspace/verify.py'
      - 'src/aria_code/ariarc.py'
      - 'src/aria_code/packs/rules.py'
      - 'src/aria_code/runtime/baseline.py'
      - 'src/aria_code/runtime/review.py'
      - 'tests/test_relay_contract.py'
      - 'src/aria_code/runtime/delivery.py'
      - 'src/aria_code/runtime/acceptance.py'
      - 'src/aria_code/safety/risk.py'
      - 'src/aria_code/safety/permissions.py'
      - 'src/aria_code/runtime/contract.py'
      - 'src/aria_code/apps/cli/providers/runtime_bridge.py'
      - 'src/aria_code/ui/render/output.py'
      - 'tests/test_native_checkpoints.py'
      - 'src/aria_code/change_store.py'
      - 'src/aria_code/runtime/checkpoints.py'
      - 'src/aria_code/runtime/run_store.py'
      - 'src/aria_code/apps/cli/native_bridge.py'
      - 'src/aria_code/apps/cli/tools/file_tools.py'
      - 'src/aria_code/workspace/files.py'
      - 'src/aria_code/training/**'
      - 'src/aria_code/domain/backtest_engine.py'
      - '.github/workflows/go-runtime.yml'
      - '.github/scripts/annotate-failure.sh'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/runtime/go.mod
          cache-dependency-path: go/runtime/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the pinned Rust frontend for process-boundary tests
        working-directory: rust
        run: |
          rustup show
          cargo build --release --locked
      - name: Format, vet and race tests
        working-directory: go/runtime
        run: |
          log="$RUNNER_TEMP/go-checks.log"
          annotate() { "$GITHUB_WORKSPACE/.github/scripts/annotate-failure.sh" "$1" "$log"; exit 1; }
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted" > "$log"; annotate "gofmt"; fi
          go vet ./... > "$log" 2>&1 || annotate "go vet"
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee "$log" || { grep -E -e '--- FAIL|^FAIL|_test\.go:[0-9]+|panic:|race detected' "$log" > "$log.failures"; mv "$log.failures" "$log"; annotate "go test"; }
      - name: Build the runtime without a Python worker
        working-directory: go/runtime
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/aria-runtime${{ matrix.os == 'windows-latest' && '.exe' || '' }}" .
      - name: Verify native protocols and compare retained business behavior
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          ARIA_GO_RUNTIME_BINARY: ${{ runner.temp }}/aria-runtime${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          ARIA_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/aria-native${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        run: |
          python -m pip install pytest pytest-timeout PyYAML pyte
          set -o pipefail
          python -m pytest tests/test_native_runtime_domain.py tests/test_native_training_compare.py tests/test_native_training_dataset.py tests/test_native_go_app.py tests/test_native_go_bridge.py tests/test_native_go_stream.py tests/test_native_go_risk.py tests/test_native_go_contract.py tests/test_native_go_delivery.py tests/test_native_go_review.py tests/test_native_go_acceptance.py tests/test_native_go_providers.py tests/test_native_eval_trajectories.py tests/test_native_checkpoints.py -q --timeout=60 --tb=short -rf 2>&1 | tee "$RUNNER_TEMP/pytest.log" \
            || { .github/scripts/annotate-failure.sh pytest "$RUNNER_TEMP/pytest.log" 120; exit 1; }
