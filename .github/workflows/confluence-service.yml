name: Confluence Service (Gateway)

on:
  push:
    branches: [main]
    paths:
      - "services/arthera-for-confluence/**"
      - ".github/workflows/confluence-service.yml"
  pull_request:
    paths:
      - "services/arthera-for-confluence/**"
      - ".github/workflows/confluence-service.yml"

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/arthera-for-confluence/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run gateway unit tests
        run: python -m pytest tests -q --timeout=30
