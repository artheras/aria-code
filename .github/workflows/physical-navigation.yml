name: Native navigation simulation
on:
  pull_request:
    paths:
      - 'rust/**'
      - 'tests/test_native_physical.py'
      - 'tests/test_warehouse_task_agent.py'
      - 'src/aria_code/agents/**'
      - 'src/aria_code/apps/cli/tool_scope.py'
      - 'src/aria_code/apps/cli/prompts/select.py'
      - 'src/aria_code/runtime/tool_executor.py'
      - 'src/aria_code/packages/aria_mcp/**'
      - 'src/aria_code/aria_cli.py'
      - 'src/aria_code/apps/cli/headless.py'
      - '.github/workflows/physical-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'tests/test_native_physical.py'
      - 'tests/test_warehouse_task_agent.py'
      - 'src/aria_code/agents/**'
      - 'src/aria_code/apps/cli/tool_scope.py'
      - 'src/aria_code/apps/cli/prompts/select.py'
      - 'src/aria_code/runtime/tool_executor.py'
      - 'src/aria_code/packages/aria_mcp/**'
      - 'src/aria_code/aria_cli.py'
      - 'src/aria_code/apps/cli/headless.py'
      - '.github/workflows/physical-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rust format and service tests
        working-directory: rust
        run: |
          rustup component add rustfmt
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo build --locked -p aria-native -p aria-physical
      - name: Independent executable and HTTP checks
        env:
          ARIA_PHYSICAL_BINARY: ${{ github.workspace }}/rust/target/debug/aria-physical${{ runner.os == 'Windows' && '.exe' || '' }}
          PYTHONPATH: ${{ github.workspace }}/src
          ARIA_NATIVE_BINARY: ${{ github.workspace }}/rust/target/debug/aria-native${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          python -m pip install -e .
          python tests/test_native_physical.py
          python tests/test_warehouse_task_agent.py
