name: Publish Package

on:
  push:
    tags:
      - "v*"
  # Called directly by release-on-merge.yml. A tag pushed with
  # GITHUB_TOKEN does not start a new workflow run — GitHub suppresses
  # that to prevent recursion — so v0.1.0 and v0.2.0 were tagged and
  # never published, silently. Being callable removes the need for a
  # PAT and makes a publish failure fail the run that caused it.
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z tag to publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.68.0)"
        required: true

jobs:
  # Every checkout below pins `ref` to the tag being released. Without it,
  # actions/checkout takes the ref that triggered the run — and when this
  # workflow is *called* rather than triggered by a tag push, that is the
  # caller's branch, i.e. main at the merge commit, one commit before
  # release-on-merge's version bump.
  #
  # v0.50.0 failed exactly there: the run's head was be60f8c (pyproject
  # 0.49.0) while the tag pointed at cff7dec (pyproject 0.50.0), so
  # verify-version compared 0.49.0 against v0.50.0 and failed. Every job
  # downstream needs it, so npm, PyPI and the GitHub release were all skipped.
  #
  # It never broke before because a tag push makes github.ref_name the tag,
  # which is what the default checkout wanted. The bug only exists on the
  # workflow_call path — the path that was added to stop tags publishing
  # nothing.
  verify-version:
    name: Verify version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pyproject / package.json / _version.py must agree with the tag
        run: python scripts/bump_version.py --check "${{ inputs.tag || github.ref_name }}"

  create-release:
    # 2026-08-20：这个 job 以前不存在，后果是 Releases 页停在 v4.2.0。
    # build-native-binaries.yml 用 `gh release upload <tag>` 附二进制，那条命令
    # 要求 release 已经存在——没有任何一步创建它，于是 v4.2.0 一个产物都没有、
    # v4.3.0 干脆没有 release。这里创建，且刻意排在最前：二进制要构建好几分钟，
    # 等它们跑完时 release 早就在了。
    name: Stage GitHub Release
    if: startsWith(inputs.tag || github.ref_name, 'v')
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0   # --generate-notes 需要完整历史才能算出上一次 release 以来的提交
      - name: Create a draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release must not become latest until every platform asset and
          # registry package is available. The orchestrator publishes it last.
          if gh release view "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ inputs.tag || github.ref_name }} already exists — leaving it as is."
          else
            gh release create "${{ inputs.tag || github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ inputs.tag || github.ref_name }}" \
              --generate-notes --draft || \
              gh release view "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" >/dev/null
          fi

  publish-npm:
    name: Publish to npmjs.com
    # The wait below (150 min) plus the publish itself.
    timeout-minutes: 165
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      # The dispatcher lists the platform packages as optionalDependencies.
      # build-native-binaries.yml publishes them from the same tag, in parallel
      # with this workflow, so without waiting the dispatcher can land first —
      # and npm skips an optionalDependency it cannot resolve, silently, leaving
      # anyone who installs in that window with a launcher and no binary.
      # Never publish a
      # dispatcher unless every package it pins exists at the same version.
      - name: Wait for this version's platform packages
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PACKAGE_LINES="$(node - <<'NODE'
          const manifest = require("./npm/package.json");
          const dependencies = Object.entries(manifest.optionalDependencies || {});
          if (dependencies.length === 0 ||
              dependencies.some(([name, version]) =>
                !name.startsWith("@artheras/aria-code-") || version !== manifest.version)) {
            console.error("Dispatcher platform pins are missing or do not match its version.");
            process.exit(1);
          }
          for (const [name, version] of dependencies) console.log(`${name}@${version}`);
          NODE
          )"
          if [ "$VERSION" != "$(node -p 'require("./npm/package.json").version')" ]; then
            echo "::error::The release tag does not match npm/package.json"
            exit 1
          fi
          PACKAGES=()
          while IFS= read -r pkg; do PACKAGES+=("$pkg"); done <<< "$PACKAGE_LINES"
          # Builds, ten large uploads and registry visibility share this budget.
          # v0.76.0 Linux uploads succeeded, but npm exposed their versions
          # after the old 30-minute gate expired. Never publish an incomplete
          # dispatcher.
          #
          # This budget must outlast the platform job, which this job does not
          # depend on: five builds, then ten uploads, then up to 45 minutes of
          # its own visibility wait. v0.105.0: this wait started at 08:52, the
          # platform job only began publishing at 09:01 (builds) and finished at
          # 09:55 — two minutes after the old one-hour gate gave up. All ten
          # platform packages shipped; the dispatcher never did.
          DEADLINE=$(( $(date +%s) + 9000 ))
          PAUSE=20
          while :; do
            MISSING=()
            THROTTLED=0
            for pkg in "${PACKAGES[@]}"; do
              name="${pkg%@*}"
              version="${pkg##*@}"
              encoded="${name/\//%2F}"
              # Ask the registry for that exact version, past every cache.
              # `npm view` reads through the runner's npm cache and the
              # registry CDN (about five minutes each), so a package published
              # mid-wait could stay invisible for several more polls.
              status="$(curl -s -o /dev/null -w '%{http_code}' -H "Cache-Control: no-cache" \
                "https://registry.npmjs.org/${encoded}/${version}?nocache=${RANDOM}$(date +%s)")" || true
              [ "$status" = "200" ] && continue
              # v0.84.0: all ten packages were on npm by 18:05 and this loop
              # still waited until its 18:46 deadline, saying only "missing".
              # A 404 on the version path is not proof — the package document
              # lists every published version — and a 429 or 5xx means the
              # registry is throttling this runner, not that nothing is there.
              if curl -sf -H "Accept: application/vnd.npm.install-v1+json" -H "Cache-Control: no-cache" \
                  "https://registry.npmjs.org/${encoded}?nocache=${RANDOM}$(date +%s)" \
                  | grep -qF "\"${version}\""; then
                continue
              fi
              case "$status" in 429|5*|000|"") THROTTLED=1 ;; esac
              MISSING+=("$pkg (HTTP ${status:-none})")
            done
            if [ "${#MISSING[@]}" -eq 0 ]; then
              echo "All ${#PACKAGES[@]} platform packages are published at $VERSION"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              printf '::error::Missing platform package: %s\n' "${MISSING[@]}"
              echo "::error::Refusing to publish a dispatcher with missing optional dependencies"
              exit 1
            fi
            # Ten requests every 20 seconds for an hour invites throttling;
            # back off while the registry pushes back.
            if [ "$THROTTLED" = 1 ]; then
              PAUSE=$(( PAUSE * 2 > 120 ? 120 : PAUSE * 2 ))
              echo "Registry throttled or unavailable; next check in ${PAUSE}s"
            else
              PAUSE=20
            fi
            echo "Waiting for platform packages: ${MISSING[*]}"
            sleep "$PAUSE"
          done

      - name: Require npm publishing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured"
            exit 1
          fi

      - name: Publish @artheras/aria-code to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public || {
            echo "::error::npm rejected @artheras/aria-code. Check that the token's account can publish in the @artheras scope and that the token allows package write and CI publishing."
            exit 1
          }

  # The pure wheel runs the Python engine. Platform wheels carry the Rust
  # frontend and the Go engine from this version's native archives
  # (scripts/platform_wheels.py), so a pip install on those five platforms
  # runs what the native release runs. The archives sit on the draft release,
  # which only a token with write access can read; that is all this job
  # writes with, and it publishes nothing.
  platform-wheels:
    name: Build platform wheels
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + pure wheel
        run: uv build

      - name: Wait for this version's native archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Built and attached by build-native-binaries.yml, which this job
          # cannot depend on; the same budget as the npm platform packages.
          WANTED="aria-code-linux-x64.tar.gz aria-code-linux-arm64.tar.gz aria-code-macos-arm64.tar.gz aria-code-macos-x64.tar.gz aria-code-windows-x64.zip"
          DEADLINE=$(( $(date +%s) + 9000 ))
          while :; do
            ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)"
            MISSING=""
            for asset in $WANTED; do
              grep -qxF "$asset" <<< "$ASSETS" || MISSING="$MISSING $asset"
            done
            [ -z "$MISSING" ] && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Native archives missing from release $TAG:$MISSING"
              exit 1
            fi
            echo "Waiting for:$MISSING"
            sleep 60
          done
          mkdir -p native
          for asset in $WANTED; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir native
          done

      - name: Build platform wheels
        run: |
          set -euo pipefail
          python3 scripts/platform_wheels.py --wheel dist/*-py3-none-any.whl --archives native --out dist
          ls -l dist

      - name: The Linux x86_64 wheel runs the Go engine
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install --quiet --no-deps dist/*-manylinux_*_x86_64.whl
          BIN="$("$RUNNER_TEMP/wheel/bin/python" -I -c 'import aria_code, pathlib; print(pathlib.Path(aria_code.__file__).parent / "_bin")')"
          test "$("$BIN/aria-runtime" --version)" = "aria-runtime ${TAG#v}"
          test "$("$BIN/aria-native" --entry-protocol)" = "1"
          "$RUNNER_TEMP/wheel/bin/python" -I -c 'from aria_code.runtime.native_index import native_binary; import sys; sys.exit(0 if native_binary() == sys.argv[1] else 1)' "$BIN/aria-native"
          python3 - "$BIN/aria-native" "$RUNNER_TEMP/wheel/bin/python" "${TAG#v}" <<'SMOKE'
          import json, os, subprocess, sys, tempfile
          frontend, python, version = sys.argv[1:]
          home = tempfile.mkdtemp()
          env = dict(os.environ, HOME=home, ARIA_HOME=os.path.join(home, "state"), ARIA_OFFLINE="1", ARIA_PYTHON=python)
          env.pop("ARIA_ENGINE", None)
          p = subprocess.Popen([frontend, "--python", python, "chat", "--jsonl"], cwd=home, env=env,
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          ready = None
          for line in p.stdout:
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              if event.get("type") == "session.ready":
                  ready = event
                  p.stdin.write('{"type":"shutdown","protocol":1}\n')
                  p.stdin.flush()
              elif event.get("type") in ("session.failed", "protocol.error"):
                  sys.exit(f"the session failed: {event}")
          p.wait(timeout=30)
          # The Go engine sends the robot design; the Python engine does not.
          if not ready or ready.get("version") != version or (ready.get("robot") or {}).get("design") != "cream-block-v2":
              sys.exit(f"the session did not come from the bundled Go engine: {ready}")
          print("platform wheel: Rust frontend and Go engine", version)
          SMOKE

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [verify-version, platform-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # enables PyPI Trusted Publishing (OIDC) as an alternative
    env:
      # Graceful skip if the token secret isn't configured yet (referencing a
      # secret in env is allowed; referencing one in a job-level `if` is not).
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: The sdist, the pure wheel and the platform wheels
        if: env.HAS_PYPI_TOKEN == 'true'
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Check distribution metadata
        if: env.HAS_PYPI_TOKEN == 'true'
        run: uvx twine check dist/*

      # twine check validates metadata and passes happily on a wheel that
      # contains nothing else. A misconfigured packages.find made exactly that:
      # six metadata entries, zero modules, 7 KB against the 1.75 MB that 4.4.2
      # published — an install that succeeds and then fails on `import
      # aria_code`. Since the token was unset the release skipped and it never
      # shipped, which was luck, not a gate.
      - name: The distribution must actually contain the package
        if: env.HAS_PYPI_TOKEN == 'true'
        shell: bash
        run: |
          python - <<'CHECK'
          import pathlib, sys, tarfile, zipfile

          MIN_MODULES = 100
          problems = []

          for wheel in pathlib.Path("dist").glob("*.whl"):
              names = zipfile.ZipFile(wheel).namelist()
              modules = [n for n in names if n.startswith("aria_code/") and n.endswith(".py")]
              print(f"{wheel.name}: {len(modules)} modules")
              if len(modules) < MIN_MODULES:
                  problems.append(f"{wheel.name} holds {len(modules)} aria_code modules")
              for needed in ("aria_code/aria_cli.py", "aria_code/apps/cli/main.py"):
                  if needed not in names:
                      problems.append(f"{wheel.name} is missing {needed}")

          for sdist in pathlib.Path("dist").glob("*.tar.gz"):
              with tarfile.open(sdist) as tar:
                  modules = [n for n in tar.getnames()
                             if "/src/aria_code/" in n and n.endswith(".py")]
              print(f"{sdist.name}: {len(modules)} modules")
              if len(modules) < MIN_MODULES:
                  problems.append(f"{sdist.name} holds {len(modules)} aria_code modules")

          if not list(pathlib.Path("dist").glob("*")):
              problems.append("dist/ is empty — nothing was built")

          if problems:
              print("\nRefusing to publish:")
              for p in problems:
                  print(f"  - {p}")
              print("\nCheck [tool.setuptools.packages.find] where in pyproject.toml.")
              sys.exit(1)
          print("\nOK: the distribution contains the package")
          CHECK

      - name: Publish to PyPI
        if: env.HAS_PYPI_TOKEN == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Skipped notice
        if: env.HAS_PYPI_TOKEN != 'true'
        run: echo "PYPI_API_TOKEN secret not set — skipping PyPI publish. Add it in repo Settings → Secrets, or configure PyPI Trusted Publishing."

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@artheras"

      - name: Prepare scoped package for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@artheras/aria-code';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com/', access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
        working-directory: npm

      - name: Publish @artheras/aria-code to GitHub Packages
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Did any of that actually publish anything? ──────────────────────────────
  # Four consecutive releases tagged a version and published nothing: v0.45.0
  # and v0.46.0 (the release workflow could not start), v0.47.0 (the platform
  # packages could not be assembled) and v0.48.0 (npm rejected them). Each one
  # left a tag in the repository pointing at a version that does not exist on
  # any registry, and nothing anywhere said so.
  #
  # A tag is a promise that something shipped. This job is what checks the
  # promise was kept, and it is the piece that was missing the whole time —
  # every failure above was found by someone opening a workflow run and
  # reading it, which is not a control.
  #
  # `always()` so this reports on a release where a publish job failed, which
  # is exactly when it matters. A registry the release deliberately skipped
  # (no token configured) is reported, not failed: that is a choice, not a
  # broken release.
  verify-published:
    name: Verify the release actually shipped
    needs: [publish-npm, publish-pypi]
    if: always() && startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: The tagged version must exist on PyPI and npm
        env:
          INPUT_TAG: ${{ inputs.tag }}
          NPM_RESULT: ${{ needs.publish-npm.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MISSING=0

          echo "Checking that $VERSION is on the registries it claims to be on."
          echo "  publish-npm:  $NPM_RESULT"
          echo "  publish-pypi: $PYPI_RESULT"
          echo

          # The platform packages the dispatcher pins. A dispatcher published
          # without them installs a launcher and no binary, and npm reports
          # nothing, because skipping an unresolvable optionalDependency is
          # what npm is supposed to do.
          PACKAGE_LINES="$(node - <<'NODE'
          const manifest = require("./npm/package.json");
          for (const [name, version] of Object.entries(manifest.optionalDependencies || {})) {
            console.log(`${name}@${version}`);
          }
          NODE
          )"

          # What still has to be seen, one per line. PyPI is queried through
          # the JSON API rather than `pip index`, which is marked experimental
          # and has changed output more than once.
          PENDING="pypi:aria-code@$VERSION
          npm:@artheras/aria-code@$VERSION
          $(sed 's/^/npm:/' <<< "$PACKAGE_LINES")"

          # npm is asked directly, past every cache, the way publish-npm's wait
          # asks. `npm view` reads through the runner's npm cache and the
          # registry CDN, which can keep answering "no such version" for a
          # dispatcher published seconds earlier: v0.103.0's was on npm at
          # 08:12:45, this step began at 08:12:57 and failed it five minutes
          # later.
          npm_has() {
            local name="${1%@*}" version="${1##*@}"
            local encoded="${name/\//%2F}"
            [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' \
                "https://registry.npmjs.org/${encoded}/${version}?nocache=${RANDOM}$(date +%s)")" = "200" ] && return 0
            curl -sf -H 'Accept: application/vnd.npm.install-v1+json' -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/${encoded}?nocache=${RANDOM}$(date +%s)" | grep -qF "\"${version}\""
          }
          seen() {
            case "$1" in
              pypi:*) curl -sf -H 'Cache-Control: no-cache' "https://pypi.org/pypi/aria-code/$VERSION/json" >/dev/null ;;
              npm:*)  npm_has "${1#npm:}" ;;
            esac
          }

          # Both registries are eventually consistent. v0.58.0 was published
          # completely and this step still failed it: npm answered "no such
          # version" for a dispatcher written moments earlier. So something
          # absent is re-asked for up to fifteen minutes before it counts as
          # missing, and only what is still absent is re-asked.
          for attempt in $(seq 1 31); do
            STILL=""
            while IFS= read -r item; do
              item="$(echo "$item" | xargs)"
              [ -n "$item" ] || continue
              if seen "$item"; then
                echo "✓ ${item#*:}"
              else
                STILL="$STILL$item"$'\n'
              fi
            done <<< "$PENDING"
            PENDING="$STILL"
            [ -z "$PENDING" ] && break
            [ "$attempt" -lt 31 ] && { echo "  not visible yet, re-checking in 30 s:"; echo -n "$PENDING" | sed 's/^/    /'; sleep 30; }
          done

          while IFS= read -r item; do
            [ -n "$item" ] || continue
            echo "::error::${item%%:*} has no ${item#*:}, but $TAG was tagged"
            MISSING=1
          done <<< "$PENDING"

          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "::error::$TAG is tagged but not published. Either publish it or delete the tag —"
            echo "::error::a tag that points at nothing is how v0.45.0 through v0.48.0 accumulated."
            exit 1
          fi
          echo
          echo "### $TAG is published" >> "$GITHUB_STEP_SUMMARY"
