# One merge to main = one release, and a release bumps minor.
#
# Codex's scheme, measured from its 196 published stable versions: major is
# always 0, minor carries the release count (0.157.0 → 0.158.0 → 0.159.0), and
# patch is reserved for a fix on top of a release that already shipped
# (0.159.1, 0.159.2). Reaching 0.121.0 takes 121 releases — that is how Codex
# reached 0.159, and it is the point.
#
# What makes the count climb is not the numbering, it is that each release
# contains one merge. Before this, a release here carried 65–96 commits
# (v4.4.1 → v4.4.2 was 96 commits over 8 days).
#
# Hotfixes are not automated: scripts/bump_version.py --next-hotfix exists for
# when a shipped release needs a fix, and it is run by hand on purpose so this
# workflow cannot produce one by accident.
#
# This workflow tags, builds, publishes packages, and finally makes the draft
# GitHub Release public. An incomplete release must never become /releases/latest.
name: Release on merge

on:
  push:
    branches: [main]

# The union of what this workflow and everything it calls need. A called
# workflow's jobs cannot request more than the caller's GITHUB_TOKEN was
# granted: anything not listed here is `none` for them, and GitHub rejects the
# whole file before running a single job ("the workflow is requesting
# 'packages: write', but is only allowed 'contents: write'").
#
# That is what happened. When release-on-merge started *calling* publish.yml
# instead of relying on the tag to trigger it, publish.yml's jobs kept asking
# for packages: write (GitHub Packages) and id-token: write (npm provenance,
# PyPI Trusted Publishing) while this file still granted only contents: write.
# Every merge from #48 onward failed with startup_failure — no tag, no release,
# and nothing red anywhere except a workflow run nobody was watching. Four
# merges shipped nothing.
#
# tests/test_release_workflow_permissions.py now fails if a called workflow
# asks for a scope this list does not cover.
permissions:
  contents: write     # tag, push the bump commit, create the GitHub release
  packages: write     # publish-github-packages
  id-token: write     # npm provenance, PyPI Trusted Publishing (OIDC)

concurrency:
  # Two merges landing together must not race to claim the same patch number.
  group: release-on-merge
  cancel-in-progress: false

jobs:
  tag-next-patch:
    name: Tag the next patch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    # The bump commit this job pushes lands on main and would trigger the
    # workflow again. Skipping on its own marker is what stops the loop;
    # [skip ci] alone would not, because that only suppresses some providers.
    if: |
      !startsWith(github.event.head_commit.message, 'release: v') &&
      !contains(github.event.head_commit.message, '[skip release]')
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: --next-release compares pyproject against the
          # highest existing tag, and a shallow clone has neither.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the next version
        id: next
        run: |
          VERSION="$(python scripts/bump_version.py --next-release)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next release: v$VERSION"

      - name: Refuse if that tag already exists
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.next.outputs.version }}" >/dev/null; then
            echo "::error::v${{ steps.next.outputs.version }} already exists. Nothing was published."
            exit 1
          fi

      - name: Set the version in all three files
        run: python scripts/bump_version.py "${{ steps.next.outputs.version }}"

      - name: Confirm the three files agree
        run: python scripts/bump_version.py --check "v${{ steps.next.outputs.version }}"

      # tests/test_version_consistency.py requires an entry for the current
      # version, and it was right to: 4.3.0 shipped with no description of what
      # changed. The first two automated releases (4.4.3, 4.4.4) bumped the
      # version and left the changelog alone, so that guard went red on main —
      # the automation has to write the entry, not the person who is no longer
      # in the loop.
      #
      # One merge is one release, so the merge subject is the entry. It is a
      # rolling log, not a curated one; a release worth more than a line gets a
      # hand-written section added afterwards.
      - name: Write the changelog entry
        shell: bash
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${{ steps.next.outputs.version }}"
          # First line only: merge commits carry the PR body after a blank line.
          LINE="$(printf '%s' "$SUBJECT" | head -1)"
          python - "$VERSION" "$LINE" <<'PY'
          import datetime, pathlib, sys

          version, subject = sys.argv[1], sys.argv[2]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          if f"[{version}]" in text:
              print(f"[{version}] already documented; leaving it alone")
              raise SystemExit(0)

          entry = (f"## [{version}] — {datetime.date.today().isoformat()}\n\n"
                   f"- {subject}\n\n")
          marker = "---\n\n"
          if marker in text:
              head, rest = text.split(marker, 1)
              path.write_text(head + marker + entry + rest, encoding="utf-8")
          else:
              path.write_text(entry + text, encoding="utf-8")
          print(f"Added [{version}]: {subject}")
          PY

      - name: Commit and tag
        run: |
          # GitHub attributes a commit by matching its email to an account. This
          # used to be "aria-release[bot]@users.noreply.github.com", a name chosen
          # without checking whether it was taken — and it was: aria-release[bot]
          # is a GitHub App belonging to an unrelated organisation
          # (flylance-apps), so every release commit showed their logo and
          # linked to their app.
          #
          # github-actions[bot] is also the honest identity: the push is made
          # with GITHUB_TOKEN. The numeric prefix is that account's id
          # (41898282), which is what makes GitHub resolve it unambiguously
          # rather than by a login that anyone could have registered.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml npm/package.json src/aria_code/_version.py CHANGELOG.md
          VERSION="${{ steps.next.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          git commit -m "release: v$VERSION"
          git tag "v$VERSION"

          # --atomic: both refs land or neither does.
          #
          # This used to push the commit and the tag in one command without it,
          # with a comment saying they went "together". They did not: git
          # pushes each refspec independently unless told otherwise, so when
          # the branch push was rejected the tag still landed.
          #
          # That is how v0.51.0 became a tag pointing at a commit that is not
          # on main. The next run then computed 0.51.0 again — main's version
          # was still 0.50.0, because the bump never landed — and refused
          # because the tag existed. The release pipeline was stuck until
          # someone deleted the tag by hand.
          #
          # The retry is for the cause rather than the symptom. Two merges 24
          # seconds apart is all it takes: this job checks out, bumps, commits
          # and pushes, and a merge that lands in that window makes the push a
          # non-fast-forward. The concurrency group serialises release *runs*,
          # but a merge is an ordinary push by GitHub and is not in the group.
          #
          # Rebasing keeps the version correct: only a release changes the
          # version files, releases are serialised, so whatever arrived in the
          # window was a merge and left them alone.
          for attempt in 1 2 3; do
            if git push --atomic origin "HEAD:$BRANCH" "refs/tags/v$VERSION"; then
              echo "pushed v$VERSION on attempt $attempt"
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt); $BRANCH moved — rebasing"
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || {
              echo "::error::could not rebase the release commit onto $BRANCH"
              exit 1
            }
            # The commit moved, so the tag has to follow it.
            git tag -f "v$VERSION"
          done
          echo "::error::could not push v$VERSION after 3 attempts. Nothing was"
          echo "::error::published and no tag was created, because the push is atomic."
          exit 1

      - name: Summary
        run: |
          echo "### Released v${{ steps.next.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing runs in this workflow — see the jobs below." >> "$GITHUB_STEP_SUMMARY"

  # Called, not triggered. A tag pushed with GITHUB_TOKEN does not start a new
  # workflow run — GitHub suppresses that to prevent recursion — so the previous
  # arrangement tagged v0.1.0 and v0.2.0 and published neither, without failing
  # anything. Calling the workflows keeps it in one run: if publishing breaks,
  # the release that caused it goes red.
  #
  # The binaries go first: the dispatcher package lists the platform packages as
  # optionalDependencies, and npm silently skips one it cannot resolve.
  binaries:
    name: Build and publish the platform binaries
    needs: tag-next-patch
    uses: ./.github/workflows/build-native-binaries.yml
    secrets: inherit
    with:
      tag: ${{ needs.tag-next-patch.outputs.tag }}

  # Deliberately NOT `needs: binaries`. PyPI and npm are independent registries
  # and the Python distribution contains no npm artifact, but with that
  # dependency in place a failure publishing the npm platform packages skipped
  # publishing to PyPI as well. That is what happened to v0.48.0: all five
  # binaries built, the packages assembled, `npm publish` failed on
  # credentials — and the Python package, which needed none of it, was never
  # published either.
  #
  # The ordering the npm side genuinely needs is still enforced, one level
  # down: publish.yml's publish-npm waits for this version's platform packages
  # to appear on the registry before publishing the dispatcher, with a timeout
  # and a warning rather than a hard failure. That is the right place for it,
  # because it is npm's constraint and nobody else's.
  publish:
    name: Publish to npm, PyPI and GitHub
    needs: tag-next-patch
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      tag: ${{ needs.tag-next-patch.outputs.tag }}

  finalize-release:
    name: Publish the verified GitHub Release
    needs: [tag-next-patch, binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-next-patch.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify artifacts and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.tag-next-patch.outputs.tag }}
        run: bash scripts/finalize_release.sh "$RELEASE_TAG"
