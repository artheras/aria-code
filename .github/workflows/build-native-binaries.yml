name: Build Native Binaries

# Builds a standalone PyInstaller binary per OS — the same architecture
# scripts/build_native_binary.sh uses locally on macOS (which also signs +
# notarizes when the real Developer ID cert is available; CI has no cert
# imported, so the macOS leg here produces an unsigned build and says so
# explicitly rather than claiming Gatekeeper-readiness it hasn't earned).
# Windows/Linux need no signing step — there's no notarization-equivalent
# gate blocking a plain .exe/ELF binary from running.
#
# Every build is PyInstaller --onedir, shipped as one archive per binary
# (.tar.gz, or .zip on Windows). --onefile unpacked ~400 native libraries to a
# new temp directory on every launch and macOS re-scanned each one: 90 s per
# command. See scripts/package_onedir.py.

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'src/aria_code/apps/cli/native_entry.py'
      - 'src/aria_code/apps/cli/native_branding.py'
      - 'src/aria_code/apps/cli/app_server.py'
      - 'scripts/build_native_binary.sh'
      - 'scripts/bundle_native_indexer.py'
      - 'scripts/verify_native_frontend.py'
      - '.github/workflows/build-native-binaries.yml'
  push:
    tags:
      - "v*"
  # Called directly by release-on-merge.yml. A tag pushed with
  # GITHUB_TOKEN does not start a new workflow run — GitHub suppresses
  # that to prevent recursion — so v0.1.0 and v0.2.0 were tagged and
  # never published, silently. Being callable removes the need for a
  # PAT and makes a publish failure fail the run that caused it.
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z tag to publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.68.0)"
        required: true

env:
  PYTHON_VERSION: "3.13"
  BIN_NAME: aria-code-bin
  MCP_BIN_NAME: aria-code-mcp-bin

jobs:
  build-macos:
    # A matrix rather than a second copy of this job: the signing and
    # notarization steps below are 40 lines that must stay identical on both
    # architectures, and duplicating them is how one of them silently stops
    # being signed. macos-15-intel is a GitHub-hosted x64 runner, so this is a
    # native build on both legs — no cross-compilation.
    name: Build (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    env:
      # Graceful skip if these secrets aren't configured — see below. Add
      # them (repo Settings → Secrets) once you have a Developer ID cert to
      # get signed+notarized release binaries; until then this job still
      # produces a working (but Gatekeeper-blocked) unsigned binary rather
      # than failing the whole workflow.
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_API_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Import Developer ID certificate into a temporary keychain
        if: env.HAS_MACOS_CERT == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key to disk
        if: env.HAS_MACOS_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: echo -n "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build (+ notarize if API-key secrets are set) via scripts/build_native_binary.sh
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ "$HAS_MACOS_CERT" == "true" && "$HAS_APPLE_NOTARY" == "true" ]]; then
            bash scripts/build_native_binary.sh --notarize
          else
            bash scripts/build_native_binary.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-macos-${{ matrix.arch }}
          path: dist-native/release/${{ env.BIN_NAME }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-mcp-macos-${{ matrix.arch }}
          path: dist-native/release/${{ env.MCP_BIN_NAME }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project + PyInstaller
        run: |
          python -m pip install --quiet -e . pyinstaller
      - name: Run PyInstaller (--onedir)
        run: >
          pyinstaller --onedir --name ${{ env.BIN_NAME }}
          --distpath dist-native/dist --workpath dist-native/build --specpath dist-native
          --paths src/aria_code --paths src
          $(python scripts/pyinstaller_collect_args.py)
          --collect-all rich --collect-all prompt_toolkit
          src/aria_code/aria_cli.py
      - name: Bundle the native indexer (aria-native)
        # The Rust project-graph indexer, in _internal/ where the frozen CLI
        # looks for it (scripts/bundle_native_indexer.py). Builds and runs it.
        shell: bash
        run: |
          (cd rust && rustup show)   # installs the toolchain rust/rust-toolchain.toml pins
          python scripts/bundle_native_indexer.py dist-native/dist/${{ env.BIN_NAME }} --frontend
          python scripts/verify_native_frontend.py dist-native/dist/${{ env.BIN_NAME }}
      - name: Smoke test
        run: dist-native\dist\${{ env.BIN_NAME }}\${{ env.BIN_NAME }}.exe --version
      - name: Archive build directory
        run: python scripts/package_onedir.py pack dist-native/dist/${{ env.BIN_NAME }} dist-native/release
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-windows-x64
          path: dist-native/release/${{ env.BIN_NAME }}.zip
          if-no-files-found: error
      - name: Run PyInstaller for the MCP server binary (--onedir)
        run: >
          pyinstaller --onedir --name ${{ env.MCP_BIN_NAME }}
          --distpath dist-native/dist --workpath dist-native/build --specpath dist-native
          --paths src/aria_code --paths src
          $(python scripts/pyinstaller_collect_args.py)
          --copy-metadata aria-code
          src/aria_code/aria_mcp_server.py
      - name: Smoke test (MCP server binary)
        run: dist-native\dist\${{ env.MCP_BIN_NAME }}\${{ env.MCP_BIN_NAME }}.exe --version
      - name: Archive the MCP server build directory
        run: python scripts/package_onedir.py pack dist-native/dist/${{ env.MCP_BIN_NAME }} dist-native/release
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-mcp-windows-x64
          path: dist-native/release/${{ env.MCP_BIN_NAME }}.zip
          if-no-files-found: error

  build-linux:
    # ubuntu-24.04-arm is a GitHub-hosted arm64 runner, so arm64 builds natively
    # here too. linux-arm64 is the growing side of this list — Graviton, GCP
    # Axion, Ampere, ARM CI runners, and any linux/arm64 container on an Apple
    # Silicon machine. Without a binary all of those fall back to pip.
    name: Build (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project + PyInstaller
        run: |
          python -m pip install --quiet -e . pyinstaller
      - name: Run PyInstaller (--onedir)
        run: >
          pyinstaller --onedir --name ${{ env.BIN_NAME }}
          --distpath dist-native/dist --workpath dist-native/build --specpath dist-native
          --paths src/aria_code --paths src
          $(python scripts/pyinstaller_collect_args.py)
          --collect-all rich --collect-all prompt_toolkit
          src/aria_code/aria_cli.py
      - name: Bundle the native indexer (aria-native)
        # The Rust project-graph indexer, in _internal/ where the frozen CLI
        # looks for it (scripts/bundle_native_indexer.py). Builds and runs it.
        run: |
          (cd rust && rustup show)   # installs the toolchain rust/rust-toolchain.toml pins
          python scripts/bundle_native_indexer.py dist-native/dist/${{ env.BIN_NAME }} --frontend
          python scripts/verify_native_frontend.py dist-native/dist/${{ env.BIN_NAME }}
      - name: Smoke test
        run: dist-native/dist/${{ env.BIN_NAME }}/${{ env.BIN_NAME }} --version
      - name: Archive build directory
        run: python scripts/package_onedir.py pack dist-native/dist/${{ env.BIN_NAME }} dist-native/release
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-linux-${{ matrix.arch }}
          path: dist-native/release/${{ env.BIN_NAME }}.tar.gz
          if-no-files-found: error
      - name: Run PyInstaller for the MCP server binary (--onedir)
        run: >
          pyinstaller --onedir --name ${{ env.MCP_BIN_NAME }}
          --distpath dist-native/dist --workpath dist-native/build --specpath dist-native
          --paths src/aria_code --paths src
          $(python scripts/pyinstaller_collect_args.py)
          --copy-metadata aria-code
          src/aria_code/aria_mcp_server.py
      - name: Smoke test (MCP server binary)
        run: dist-native/dist/${{ env.MCP_BIN_NAME }}/${{ env.MCP_BIN_NAME }} --version
      - name: Archive the MCP server build directory
        run: python scripts/package_onedir.py pack dist-native/dist/${{ env.MCP_BIN_NAME }} dist-native/release
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-mcp-linux-${{ matrix.arch }}
          path: dist-native/release/${{ env.MCP_BIN_NAME }}.tar.gz
          if-no-files-found: error

  attach-to-release:
    name: Attach binaries to GitHub Release
    if: startsWith(inputs.tag || github.event.pull_request.head.sha || github.ref_name, 'v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Derived from what actually arrived, not a hand-written list. The list
      # was six cp lines; adding darwin-x64 and linux-arm64 means ten, and a
      # forgotten line is a binary that builds, uploads as an artifact, and
      # never reaches the release. A platform whose build failed is simply
      # absent here instead of failing this step.
      - name: Collect the artifacts that arrived
        # Explicit bash: the nullglob below is a bashism, and a runner default
        # that is not bash would silently copy a literal glob.
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/aria-code-*/; do
            slug="$(basename "$dir")"          # e.g. aria-code-mcp-linux-arm64
            for file in "$dir"*; do
              case "$file" in
                *.zip)    cp "$file" "release/${slug}.zip" ;;
                *.tar.gz) cp "$file" "release/${slug}.tar.gz" ;;
                *)        echo "::error::unexpected artifact $file — every build ships an archive"; exit 1 ;;
              esac
            done
          done
          count="$(find release -maxdepth 1 -type f -name 'aria-code-*' | wc -l | tr -d ' ')"
          if [ "$count" -ne 10 ]; then
            echo "::error::expected 10 CLI/MCP release archives, found $count"
            exit 1
          fi
          (cd release && sha256sum aria-code-* > SHA256SUMS)
          echo "Attaching:"; ls -l release/
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # publish.yml 的 create-release 正常会先跑完（它只建一个 release，而这里
          # 要先构建三个平台的二进制）。但两个 workflow 由同一个 tag 并行触发，
          # 没有跨 workflow 的依赖可声明——所以这里兜一道底，免得 upload 因为
          # release 还不存在而失败。两边都是幂等的。
          if ! gh release view "${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}" \
              --generate-notes --draft || \
              gh release view "${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}" --repo "${{ github.repository }}" >/dev/null
          fi
          gh release upload "${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}" release/* --clobber --repo "${{ github.repository }}"

  # ── Publish the per-platform npm packages ───────────────────────────────────
  # These must exist on npm before the dispatcher package is published, because
  # the dispatcher lists them as optionalDependencies. publish.yml's publish-npm
  # job therefore waits on this workflow's tag run; if a platform's build failed,
  # its package is simply absent and the dispatcher says so by name rather than
  # installing something broken.
  publish-platform-packages:
    name: Publish platform packages to npm
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(inputs.tag || github.event.pull_request.head.sha || github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: built

      - name: Assemble the platform packages
        id: assemble
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Only pass a platform whose artifact actually arrived. A build that
          # failed must not become an empty package.
          ARGS=()
          # add <platform-key> <cli-dir> <cli-file> <mcp-dir> <mcp-file>
          #
          # The MCP arguments are a separate file name, not the CLI's. This
          # previously read `[ -f "built/$4/$3" ]` -- the CLI binary's name
          # inside the MCP artifact's directory -- which never matches, so no
          # --mcp was ever passed and the MCP binaries were silently left out
          # of every platform package.
          #
          # It is an if/else rather than `cond && ARGS+=(...)` for a second
          # reason: a trailing `&&` whose test is false makes the function
          # return 1, and `run:` executes under `bash -eo pipefail`, so the
          # step died on the first call before python ran at all. That is what
          # failed the v0.47.0 release.
          add() {
            if [ ! -f "built/$2/$3" ]; then
              echo "::error::no CLI binary for $1 — refusing a partial npm release"
              return 1
            fi
            ARGS+=(--binary "$1=built/$2/$3")
            if [ -f "built/$4/$5" ]; then
              ARGS+=(--mcp "$1=built/$4/$5")
            else
              echo "::error::no MCP binary for $1 — refusing a partial npm release"
              return 1
            fi
            return 0
          }
          add darwin-arm64 aria-code-macos-arm64   aria-code-bin.tar.gz  aria-code-mcp-macos-arm64  aria-code-mcp-bin.tar.gz
          add darwin-x64   aria-code-macos-x64     aria-code-bin.tar.gz  aria-code-mcp-macos-x64    aria-code-mcp-bin.tar.gz
          add linux-x64    aria-code-linux-x64     aria-code-bin.tar.gz  aria-code-mcp-linux-x64    aria-code-mcp-bin.tar.gz
          add linux-arm64  aria-code-linux-arm64   aria-code-bin.tar.gz  aria-code-mcp-linux-arm64  aria-code-mcp-bin.tar.gz
          add win32-x64    aria-code-windows-x64   aria-code-bin.zip     aria-code-mcp-windows-x64  aria-code-mcp-bin.zip
          python scripts/make_platform_packages.py --version "$VERSION" \
            --out npm/platforms "${ARGS[@]}"

      - name: Require npm publishing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured; platform packages cannot be published"
            exit 1
          fi

      - name: Publish each platform package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          shopt -s nullglob
          packages=(npm/platforms/*/)
          if [ "${#packages[@]}" -ne 10 ]; then
            echo "::error::Expected five CLI and five MCP packages, found ${#packages[@]}"
            exit 1
          fi
          # Check every tarball before publishing any package. npm sends the
          # tarball base64-encoded, so the 256 MiB publish limit is ~201 MB
          # packed. v0.59.0's linux-x64 package was 201.6 MB: the old 240 MB
          # threshold let it through, npm rejected it, and the three packages
          # published before it were left without a dispatcher. 190 MB keeps
          # a margin for normal growth between releases.
          for dir in "${packages[@]}"; do
            size="$(cd "$dir" && npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(String(JSON.parse(s)[0].size)))')"
            echo "$(basename "$dir"): $size bytes packed"
            if [ "$size" -ge 190000000 ]; then
              echo "::error::$(basename "$dir") is $size bytes packed; npm's limit is ~201 MB. Slim it before publishing: EXCLUDED in the PyInstaller collector script lists what is left out"
              exit 1
            fi
          done
          # Whether name@version is on the registry, asked directly and past
          # every cache — not `npm view`, whose exit status this used to trust
          # with its output discarded: npm versions differ on whether a version
          # that does not exist is an error there, and a skipped package is
          # only noticed an hour later by the dispatcher's wait.
          published() {
            local name="$1" version="$2" encoded="${1/\//%2F}"
            [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' \
                "https://registry.npmjs.org/${encoded}/${version}?nocache=${RANDOM}$(date +%s)")" = "200" ] && return 0
            curl -sf -H 'Accept: application/vnd.npm.install-v1+json' -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/${encoded}?nocache=${RANDOM}$(date +%s)" | grep -qF "\"${version}\""
          }
          spec_of() { node -e 'const p=require(process.argv[1]); console.log(p.name+"@"+p.version)' "./${1}package.json"; }
          for dir in "${packages[@]}"; do
            spec="$(spec_of "$dir")"
            if published "${spec%@*}" "${spec##*@}"; then
              echo "── already published $spec"
              continue
            fi
            echo "── publishing $spec"
            (cd "$dir" && npm publish --access public) || {
              echo "::error::npm rejected $(basename "$dir"). E413 or a closed connection means it is too large (~201 MB packed limit); E403/E404 means the token cannot publish to the @artheras scope. The npm error is above."
              exit 1
            }
          done
          # Each package is checked until it can be seen. A version npm never
          # received is published again; one it accepted but has not exposed
          # yet answers "cannot publish over" — and is waited for. npm has
          # taken 15 minutes to expose one of these packages (v0.86.0's
          # mcp-linux-arm64) and possibly 80 (v0.81.0's darwin-arm64), so this
          # step does not fail the release over a slow registry: after 45
          # minutes it warns, and the dispatcher's own wait — which names each
          # missing package with its HTTP status — decides.
          DEADLINE=$(( $(date +%s) + 2700 ))
          while :; do
            MISSING=()
            for dir in "${packages[@]}"; do
              spec="$(spec_of "$dir")"
              published "${spec%@*}" "${spec##*@}" || MISSING+=("$dir")
            done
            if [ "${#MISSING[@]}" -eq 0 ]; then
              echo "All ${#packages[@]} platform packages are visible on the registry"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              for dir in "${MISSING[@]}"; do echo "::warning::Not on the registry yet: $(spec_of "$dir")"; done
              break
            fi
            for dir in "${MISSING[@]}"; do
              echo "── not visible yet, publishing again: $(spec_of "$dir")"
              (cd "$dir" && npm publish --access public) || true
            done
            sleep 30
          done
