name: Rust CLI

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'src/aria_code/apps/cli/native_bridge.py'
      - 'src/aria_code/apps/cli/app_server.py'
      - 'src/aria_code/apps/cli/conversation_policy.py'
      - 'src/aria_code/apps/cli/tool_scope.py'
      - 'src/aria_code/apps/cli/providers/runtime_bridge.py'
      - 'src/aria_code/apps/cli/chat_turn.py'
      - 'src/aria_code/apps/cli/prompts/**'
      - 'src/aria_code/apps/cli/main.py'
      - 'src/aria_code/apps/cli/native_entry.py'
      - 'src/aria_code/apps/cli/native_branding.py'
      - 'src/aria_code/ui/robot.py'
      - 'tests/test_native_branding.py'
      - 'tests/test_native_entry.py'
      - 'src/aria_code/apps/cli/session_store.py'
      - 'src/aria_code/apps/cli/exec_events.py'
      - 'src/aria_code/apps/cli/headless.py'
      - 'src/aria_code/__init__.py'
      - 'src/aria_code/apps/cli/tools/**'
      - 'src/aria_code/runtime/**'
      - 'src/aria_code/workspace/**'
      - 'tests/test_native_bridge.py'
      - 'tests/test_frozen_module_aliases.py'
      - 'tests/test_rust_cli.py'
      - 'tests/test_rust_state.py'
      - 'tests/test_rust_stream.py'
      - 'tests/test_native_app.py'
      - 'tests/test_conversation_policy.py'
      - 'tests/test_exec_events.py'
      - 'tests/test_native_index.py'
      - 'go/buildtools/**'
      - 'scripts/benchmark_rust_cli.py'
      - '.github/workflows/rust-cli.yml'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'src/aria_code/apps/cli/native_bridge.py'
      - 'src/aria_code/apps/cli/app_server.py'
      - 'src/aria_code/apps/cli/conversation_policy.py'
      - 'src/aria_code/apps/cli/tool_scope.py'
      - 'src/aria_code/apps/cli/providers/runtime_bridge.py'
      - 'src/aria_code/apps/cli/chat_turn.py'
      - 'src/aria_code/apps/cli/prompts/**'
      - 'src/aria_code/apps/cli/main.py'
      - 'src/aria_code/apps/cli/native_entry.py'
      - 'src/aria_code/apps/cli/native_branding.py'
      - 'src/aria_code/ui/robot.py'
      - 'tests/test_native_branding.py'
      - 'tests/test_native_entry.py'
      - 'src/aria_code/apps/cli/session_store.py'
      - 'src/aria_code/apps/cli/exec_events.py'
      - 'src/aria_code/apps/cli/headless.py'
      - 'src/aria_code/__init__.py'
      - 'src/aria_code/apps/cli/tools/**'
      - 'src/aria_code/runtime/**'
      - 'src/aria_code/workspace/**'
      - 'tests/test_native_bridge.py'
      - 'tests/test_frozen_module_aliases.py'
      - 'tests/test_rust_cli.py'
      - 'tests/test_rust_state.py'
      - 'tests/test_rust_stream.py'
      - 'tests/test_native_app.py'
      - 'tests/test_conversation_policy.py'
      - 'tests/test_exec_events.py'
      - 'tests/test_native_index.py'
      - 'go/buildtools/**'
      - 'scripts/benchmark_rust_cli.py'
      - '.github/workflows/rust-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    name: Rust + Python bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
          - os: macos-latest
            exe: ''
          - os: windows-latest
            exe: '.exe'
    env:
      ARIA_OFFLINE: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      ARIA_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/aria-native${{ matrix.exe }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/buildtools/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show
      - name: Install Python runtime and regression runner
        run: python -m pip install -e . pytest pytest-timeout pytest-asyncio pyinstaller pyte
      - name: Format, lint, test and build Rust
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked
      - name: Bundle into a PyInstaller-style directory (what native releases do)
        run: |
          mkdir -p "$RUNNER_TEMP/onedir/_internal"
          go -C go/buildtools run . --root "$GITHUB_WORKSPACE" "$RUNNER_TEMP/onedir"
      - name: Verify Go release assembler against the real Rust binary
        working-directory: go/buildtools
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Exercise real executable and existing Python tools
        run: python -m pytest tests/test_native_app.py tests/test_conversation_policy.py tests/test_native_branding.py tests/test_native_entry.py tests/test_native_bridge.py tests/test_rust_cli.py tests/test_rust_state.py tests/test_rust_stream.py tests/test_exec_events.py tests/test_headless_command_approval.py tests/test_frozen_module_aliases.py tests/test_workspace_files.py tests/test_native_index.py -q --timeout=30
      - name: Measure entry points (no cloud calls)
        run: python scripts/benchmark_rust_cli.py --binary "$ARIA_NATIVE_BINARY" --output rust/target/benchmark.json
      - name: Upload opt-in prototype and measurements
        uses: actions/upload-artifact@v4
        with:
          name: aria-native-prototype-${{ matrix.os }}
          path: |
            rust/target/release/aria-native${{ matrix.exe }}
            rust/target/benchmark.json
          if-no-files-found: error
