name: Financial Service integration
on:
  pull_request:
    paths:
      - 'src/aria_code/apps/cli/main.py'
      - 'src/aria_code/aria_mcp_server.py'
      - 'tests/test_mcp_entry_handover.py'
      - '.github/workflows/financial-service.yml'
  push:
    branches: [main, 'feat/**']
    paths:
      - 'src/aria_code/apps/cli/main.py'
      - 'src/aria_code/aria_mcp_server.py'
      - 'tests/test_mcp_entry_handover.py'
      - '.github/workflows/financial-service.yml'
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install host and the pinned shared financial service
        run: python -m pip install -e . pytest pytest-asyncio pytest-timeout "arthera-financial-service @ git+https://github.com/artheras/financial-service.git@bc866f8b5c62fd809c9fdd81bb61a8deecf89d8e"
      - name: Verify actual CLI configuration and MCP tool/error results
        shell: bash
        env:
          ARIA_OFFLINE: "1"
          FINANCIAL_SERVICE_NETWORK: "0"
        run: |
          python -c "import arthera_finance.server, arthera_finance.doctor, arthera_finance.trading_server"
          python -m pytest tests/test_mcp_entry_handover.py -q --timeout=60
