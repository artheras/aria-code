# Weekly coding and operations evals with a real model, on Vertex AI.
#
# CI only runs the suites with --check (every fixture still starts red); no
# model ever attempted them, so nothing tracked whether Aria can fix code.
# This runs evals/suites/core.yaml, operations.yaml and hard.yaml through `aria-code -p`
# with a Gemini model on Vertex AI and publishes the scoreboard as the job
# summary and an artifact.
#
# No API key: the job signs in to Google Cloud with Workload Identity
# Federation (GitHub's OIDC token, exchanged for short-lived credentials), and
# Aria uses Vertex AI whenever GOOGLE_CLOUD_PROJECT and application-default
# credentials are present. It calls Vertex directly rather than the Arthera
# backend because the backend does not pass Aria's tools to the model, and
# these tasks need them. Set three repository variables (not secrets; they are
# identifiers):
#   GCP_PROJECT                      e.g. arthera-prod
#   GCP_WORKLOAD_IDENTITY_PROVIDER   projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_EVAL_SERVICE_ACCOUNT         a service account with roles/aiplatform.user
# Without them the job says so and stops.
#
# A task the model gets wrong is a result, not a red build; the job fails only
# when a task could not run or no longer measures anything.
#
# Holdout: when the HOLDOUT_DEPLOY_KEY secret holds a read-only deploy key for
# artheras/aria-evals-holdout, its suites run too. They are twins of public
# tasks (the same skill, different data) that no model has seen, and the gap
# between the two scores shows whether the public one is inflated. Their
# reports and trajectories are never uploaded, and the summary shows only
# their counts, because this repository's run pages are public.

name: Evals

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      model:
        description: "Model id for the agent, e.g. google/gemini-3.5-flash or a Gemma id from Model Garden"
        default: "google/gemini-3.5-flash"
        required: false
      repeat:
        description: "Attempts per task. One run is one draw; use 3 for a baseline a tuned model will be compared against"
        default: "1"
        required: false

permissions:
  contents: read
  id-token: write   # for Workload Identity Federation

jobs:
  evals:
    name: Coding and operations evals
    runs-on: ubuntu-latest
    # 50 tasks, times `repeat`: most attempts finish in about a minute (24 took
    # 21 min), but a job killed at its limit uploads nothing. 360 is the most a
    # GitHub-hosted job may run; with repeat 3 that is ~150 attempts.
    timeout-minutes: 360
    env:
      READY: ${{ vars.GCP_PROJECT != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_EVAL_SERVICE_ACCOUNT != '' }}
      MODEL: ${{ github.event.inputs.model || 'google/gemini-3.5-flash' }}
      REPEAT: ${{ github.event.inputs.repeat || '1' }}
      HOLDOUT: ${{ secrets.HOLDOUT_DEPLOY_KEY != '' }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
      # global: some Gemini 3 models are served only there.
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      ARIA_OFFLINE: "1"
    steps:
      - name: Needs Google Cloud access
        if: env.READY != 'true'
        run: |
          echo "::notice::Set the GCP_PROJECT, GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_EVAL_SERVICE_ACCOUNT repository variables to run the evals on Vertex AI."
          echo "Skipped: Google Cloud variables not set." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.READY == 'true'

      - name: Sign in to Google Cloud
        if: env.READY == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT }}

      - name: Set up Python
        if: env.READY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: env.READY == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyyaml google-genai

      - name: Run the suites
        if: env.READY == 'true'
        run: |
          python -m aria_code.evals.runner evals/suites/core.yaml --model "$MODEL" \
            --solve-timeout 600 --repeat "$REPEAT" --report evals-core.json --trajectories trajectories || true
          python -m aria_code.evals.runner evals/suites/operations.yaml --model "$MODEL" \
            --solve-timeout 600 --repeat "$REPEAT" --report evals-operations.json --trajectories trajectories || true
          python -m aria_code.evals.runner evals/suites/hard.yaml --model "$MODEL" \
            --solve-timeout 600 --repeat "$REPEAT" --report evals-hard.json --trajectories trajectories || true

          python -m aria_code.evals.runner evals/suites/projects.yaml --model "$MODEL" \
            --solve-timeout 600 --repeat "$REPEAT" --report evals-projects.json --trajectories trajectories || true
          # How the agent works, not only whether it ends up right (behavior checks).
          python -m aria_code.evals.runner evals/suites/behavior.yaml --model "$MODEL" \
            --solve-timeout 600 --repeat "$REPEAT" --report evals-behavior.json --trajectories trajectories || true
          # The independent reviewer on fixed diffs: false positives and misses.
          python -m aria_code.evals.review_probe evals/review/cases.yaml --model "$MODEL" \
            --repeat "$REPEAT" --report evals-review.json || true

      - name: Check out the holdout suites
        if: env.READY == 'true' && env.HOLDOUT == 'true'
        uses: actions/checkout@v4
        with:
          repository: artheras/aria-evals-holdout
          ssh-key: ${{ secrets.HOLDOUT_DEPLOY_KEY }}
          path: .holdout
          persist-credentials: false

      - name: Run the holdout suites
        if: env.READY == 'true' && env.HOLDOUT == 'true'
        run: |
          mkdir -p .holdout-reports
          for suite in .holdout/suites/*.yaml; do
            python -m aria_code.evals.runner "$suite" --fixtures .holdout/fixtures --model "$MODEL" \
              --solve-timeout 600 --repeat "$REPEAT" --report ".holdout-reports/$(basename "$suite" .yaml).json" \
              > /dev/null 2>&1 || true
          done

      - name: Scoreboard
        if: env.READY == 'true'
        shell: bash   # -eo pipefail, so tee keeps the summary's exit code
        run: |
          shopt -s nullglob
          private=(.holdout-reports/*.json)
          python -m aria_code.evals.summary --model "$MODEL" evals-core.json evals-operations.json evals-hard.json evals-projects.json evals-behavior.json \
            ${private:+--private "${private[@]}"} | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ${#private[@]} -gt 0 ]; then
            python -m aria_code.evals.gap --markdown --public evals-core.json evals-operations.json evals-hard.json evals-projects.json \
              --holdout "${private[@]}" --suites .holdout/suites/*.yaml | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && env.READY == 'true'
        with:
          name: eval-reports
          path: |
            evals-*.json
            trajectories/
          if-no-files-found: warn
